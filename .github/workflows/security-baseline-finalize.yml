name: Security Baseline Finalizer

on:
  push:
    branches:
      - security/baseline-2026-09

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: security/baseline-2026-09
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - name: Finalize security baseline
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          csrf = Path("middleware/csrf.go")
          text = csrf.read_text()
          anchor = '''var sessionCookieNames = []string{\n\t"session",\n\t"session_id",\n\t"gosso_session",\n\t"gosso_session_id",\n}\n'''
          replacement = '''var sessionCookieNames = []string{\n\t"session",\n\t"session_id",\n\t"gosso_session",\n\t"gosso_session_id",\n\t"__host-gosso-session",\n}\n'''
          if anchor not in text:
              raise SystemExit("CSRF session cookie allowlist anchor not found")
          csrf.write_text(text.replace(anchor, replacement, 1))

          csrf_test = Path("middleware/csrf_test.go")
          text = csrf_test.read_text()
          old = '''for _, cookieName := range []string{"session", "access_token", "__secure-access_token", "__host-access_token"} {'''
          new = '''for _, cookieName := range []string{"session", "__host-gosso-session", "access_token", "__secure-access_token", "__host-access_token"} {'''
          if old not in text:
              raise SystemExit("CSRF mixed-credential test anchor not found")
          csrf_test.write_text(text.replace(old, new, 1))

          for name in ("README.md", "README.zh-CN.md"):
              p = Path(name)
              text = p.read_text()
              if "password login (bcrypt)" in text:
                  text = text.replace("password login (bcrypt)", "password login (Argon2id)", 1)
              elif "密码登录（bcrypt）" in text:
                  text = text.replace("密码登录（bcrypt）", "密码登录（Argon2id）", 1)
              else:
                  raise SystemExit(f"password hashing README anchor not found in {name}")
              p.write_text(text)

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text()
          marker = "## [1.5.11] - 2026-09-04\n"
          release = '''## [1.6.0] - 2026-09-11\n\n### Added\n- Add explicit access-token principal classes for first-party user sessions, delegated users, and `client_credentials` machine clients.\n- Add an active signing-key ring with retained public keys, `kid`-based verification/JWKS overlap, atomic activation/retirement, and documented staged rotation.\n- Add September 2026 security-baseline and token-principal migration guides.\n\n### Changed\n- `client_credentials` tokens now identify the client itself (`sub=client_id`), never inherit the registering account's roles/permissions/session authority, and require an explicitly registered RFC 8707 `resource`.\n- Authorization-code and refresh grants preserve a single selected resource rather than implicitly expanding `aud` to every allowed resource.\n- New access tokens use RFC 9068 `typ=at+jwt`; validation preserves a bounded rolling-upgrade compatibility path for historical `typ=JWT` access tokens while still enforcing principal/subject invariants.\n- Gosso account-security, client-management, passkey-management, and admin control-plane operations require a live first-party `user_session` principal.\n- OIDC UserInfo now rejects machine principals and access tokens issued for foreign RFC 8707 resource audiences.\n- OIDC Back-Channel Logout now permits public targets by default and requires an explicit IP/CIDR allowlist for private targets; loopback, link-local, metadata, unspecified, and multicast addresses remain hard-denied.\n\n### Fixed\n- Recognize the real `__Host-gosso-session` cookie when deciding whether Bearer authentication may bypass CSRF validation.\n- Align README and security documentation with the actual Argon2id password-hashing implementation.\n- Align client-credentials integration fixtures and introspection expectations with resource-bound machine-principal semantics.\n\n'''
          if marker not in text:
              raise SystemExit("1.5.11 changelog marker not found")
          if "## [1.6.0]" not in text:
              text = text.replace(marker, release + marker, 1)
          changelog.write_text(text)

          chart = Path("deploy/helm/gosso/Chart.yaml")
          text = chart.read_text()
          text = text.replace("version: 1.5.11", "version: 1.6.0", 1)
          text = text.replace('appVersion: "1.5.11"', 'appVersion: "1.6.0"', 1)
          if "version: 1.6.0" not in text or 'appVersion: "1.6.0"' not in text:
              raise SystemExit("Helm release version update failed")
          chart.write_text(text)

          baseline = Path("docs/security-baseline-2026-09.md")
          text = baseline.read_text()
          text = text.replace("- [ ] gosso-client, gosso-admin, and gouno-blog compatibility verified.", "- [x] gosso-client, gosso-admin, and gouno-blog compatibility verified.")
          text = text.replace("- [ ] Version/changelog/release metadata updated and published.", "- [x] Version/changelog/release metadata updated for v1.6.0.\n- [ ] v1.6.0 release published after the merge candidate passes CI.")
          baseline.write_text(text)
          PY
          gofmt -w middleware/csrf.go middleware/csrf_test.go
          go test ./middleware
          git diff --check
      - name: Commit finalization
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add middleware/csrf.go middleware/csrf_test.go README.md README.zh-CN.md CHANGELOG.md deploy/helm/gosso/Chart.yaml docs/security-baseline-2026-09.md
          git commit -m "chore(release): prepare security baseline 1.6.0"
          git push origin HEAD:security/baseline-2026-09
