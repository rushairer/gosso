name: Release

on:
  push:
    tags:
      - "v*"

# Default to least-privilege; jobs override as needed
permissions:
  contents: read

# Cancel redundant runs on the same tag
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.x"
  HELM_VERSION: "v4.2.3"

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write
      id-token: write   # needed for cosign keyless signing

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: go.sum

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

      - name: Test
        run: go test -race -count=1 ./internal/...

      - name: Set up QEMU (for ARM64 emulation)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Validate release metadata
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          test "$VERSION" = "$(awk '$1 == "version:" { print $2; exit }' deploy/helm/gosso/Chart.yaml)"
          test "\"$VERSION\"" = "$(awk '$1 == "appVersion:" { print $2; exit }' deploy/helm/gosso/Chart.yaml)"
          grep -Fq "## [$VERSION]" CHANGELOG.md

      - name: Build and push Docker image (multi-arch)
        id: docker-build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.VERSION }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/gosso:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/gosso:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/gosso:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      # --- Supply Chain Security: SBOM + Cosign ---

      - name: Install cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      - name: Sign Docker image with cosign
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository_owner }}/gosso@${{ steps.docker-build.outputs.digest }}

      - name: Verify Docker image signature
        env:
          IMAGE_DIGEST: ${{ steps.docker-build.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "ghcr.io/${GITHUB_REPOSITORY_OWNER}/gosso@${IMAGE_DIGEST}"

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          image: ghcr.io/${{ github.repository_owner }}/gosso@${{ steps.docker-build.outputs.digest }}
          format: cyclonedx-json
          output-file: gosso-sbom.cdx.json

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          image: ghcr.io/${{ github.repository_owner }}/gosso@${{ steps.docker-build.outputs.digest }}
          format: spdx-json
          output-file: gosso-sbom.spdx.json

      - name: Attest SBOM to image
        run: |
          cosign attest --yes \
            --predicate gosso-sbom.cdx.json \
            --type cyclonedx \
            ghcr.io/${{ github.repository_owner }}/gosso@${{ steps.docker-build.outputs.digest }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          files: |
            CHANGELOG.md
            gosso-sbom.cdx.json
            gosso-sbom.spdx.json

      # --- Helm Chart OCI Publish ---

      # v4.2.3 is the last version verified against this GHCR chart namespace.
      # Keep this pinned until a newer Helm release is explicitly validated.
      - name: Install Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Log in to GHCR with Helm
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Update Helm chart version
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          sed -i "s/^version:.*/version: ${VERSION}/" deploy/helm/gosso/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" deploy/helm/gosso/Chart.yaml

      - name: Package and push Helm chart to GHCR
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail
          helm lint deploy/helm/gosso
          helm package deploy/helm/gosso --destination /tmp
          helm push "/tmp/gosso-${VERSION}.tgz" oci://ghcr.io/${{ github.repository_owner }}/gosso/charts
          helm show chart "oci://ghcr.io/${{ github.repository_owner }}/gosso/charts/gosso" --version "$VERSION" > /tmp/published-chart.yaml
          grep -Fxq "name: gosso" /tmp/published-chart.yaml
          grep -Fxq "version: ${VERSION}" /tmp/published-chart.yaml
