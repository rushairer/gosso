name: RFC7009 OpenAPI Fixup

on:
  push:
    branches: [fix/rfc7009-csrf]
    paths:
      - ".github/workflows/openapi-rfc7009-fixup.yml"
      - "script/openapi_rfc7009_fixup.py"

permissions:
  contents: write

jobs:
  fixup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/rfc7009-csrf
          fetch-depth: 0

      - name: Apply structural OpenAPI correction
        run: |
          set -euo pipefail
          python3 script/openapi_rfc7009_fixup.py
          git diff --check

      - name: Commit OpenAPI correction
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "Aben"
          git config user.email "5195693+rushairer@users.noreply.github.com"
          git add docs/openapi.yaml
          git commit -m "docs(oauth2): align RFC 7009 revocation contract"
          git push origin HEAD:fix/rfc7009-csrf
