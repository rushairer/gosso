name: Security Baseline Coverage Diagnostic

on:
  push:
    branches:
      - security/baseline-2026-09

permissions:
  contents: read

jobs:
  coverage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: security/baseline-2026-09
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: go.sum
      - name: Generate gate coverage
        shell: bash
        run: |
          packages=$(./script/coverage-packages.sh)
          go test -p 1 -coverprofile=coverage-gate.out -covermode=atomic $packages
          awk 'NR>1 {total += $2; if ($3 > 0) covered += $2} END {printf "COVERAGE_COUNTS covered=%d total=%d missing=%d percent=%.3f required_for_70=%d\n", covered, total, total-covered, covered*100/total, int((0.70*total+0.999999)-covered)}' coverage-gate.out
          echo "--- baseline files ---"
          go tool cover -func=coverage-gate.out | grep -E 'internal/(token/domain/token.go|token/service/key_service.go|token/service/token_service(_validate)?.go|auth/middleware/auth_middleware.go|oidc/controller/oidc_controller.go|oidc/service/(logout_service|jwks_service).go|oauth2/controller/oauth2_token.go)' || true
