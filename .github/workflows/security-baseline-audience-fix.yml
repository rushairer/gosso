name: Security Baseline Audience Autofix

on:
  push:
    branches:
      - security/baseline-2026-09

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: security/baseline-2026-09
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - name: Enforce UserInfo audience
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          controller = Path("internal/oidc/controller/oidc_controller.go")
          text = controller.read_text()
          anchor = '''\tclaims, ok := jwtClaims.(*tokenDomain.AccessTokenClaims)\n\tif !ok {\n\t\tctx.JSON(http.StatusInternalServerError, gouno.NewErrorResponse(http.StatusInternalServerError, "invalid token"))\n\t\treturn\n\t}\n\n\t// Parse scope\n'''
          replacement = '''\tclaims, ok := jwtClaims.(*tokenDomain.AccessTokenClaims)\n\tif !ok {\n\t\tctx.JSON(http.StatusInternalServerError, gouno.NewErrorResponse(http.StatusInternalServerError, "invalid token"))\n\t\treturn\n\t}\n\n\t// UserInfo is itself a Gosso resource server. Tokens issued for another\n\t// RFC 8707 resource must never be accepted here, and machine principals do\n\t// not represent an end-user subject.\n\tif !claims.HasAudience(tokenDomain.GossoAPIResourceAudience) || claims.AccountID == "" || claims.IsClientPrincipal() {\n\t\tctx.JSON(http.StatusUnauthorized, gouno.NewErrorResponse(http.StatusUnauthorized, "invalid token audience or principal"))\n\t\treturn\n\t}\n\n\t// Parse scope\n'''
          if anchor not in text:
              raise SystemExit("UserInfo claims anchor not found")
          controller.write_text(text.replace(anchor, replacement, 1))

          test = Path("internal/oidc/controller/oidc_controller_test.go")
          text = test.read_text()
          anchor = '''\tengine.Use(func(ctx *gin.Context) {\n\t\tif claims != nil {\n\t\t\tctx.Set(middleware.ContextKeyClaims, claims)\n\t\t}\n\t\tctx.Next()\n\t})\n'''
          replacement = '''\tengine.Use(func(ctx *gin.Context) {\n\t\tif claims != nil {\n\t\t\tif len(claims.Audience) == 0 {\n\t\t\t\tclaims.Audience = jwt.ClaimStrings{tokenDomain.GossoAPIResourceAudience}\n\t\t\t}\n\t\t\tctx.Set(middleware.ContextKeyClaims, claims)\n\t\t}\n\t\tctx.Next()\n\t})\n'''
          if anchor not in text:
              raise SystemExit("UserInfo test helper anchor not found")
          text = text.replace(anchor, replacement, 1)

          marker = '''func TestUserInfo_NoClaims(t *testing.T) {\n'''
          new_test = '''func TestUserInfo_RejectsForeignResourceAudience(t *testing.T) {\n\taccountSvc := &mockAccountService{\n\t\tfindByIDFn: func() (*accountDomain.Account, error) {\n\t\t\treturn newTestAccount(), nil\n\t\t},\n\t}\n\tengine := setupUserInfoEngine(accountSvc, &mockCredentialRepo{}, &tokenDomain.AccessTokenClaims{\n\t\tRegisteredClaims: jwt.RegisteredClaims{Audience: jwt.ClaimStrings{"https://blog.example.test/api"}},\n\t\tAccountID:        "account-001",\n\t\tClientID:         "blog-bff",\n\t\tPrincipalType:    tokenDomain.PrincipalTypeDelegatedUser,\n\t\tScope:            "openid profile",\n\t})\n\n\treq := httptest.NewRequest(http.MethodGet, "/oidc/userinfo", nil)\n\tw := httptest.NewRecorder()\n\tengine.ServeHTTP(w, req)\n\n\tassert.Equal(t, http.StatusUnauthorized, w.Code)\n\tassert.Contains(t, w.Body.String(), "invalid token audience or principal")\n}\n\nfunc TestUserInfo_RejectsClientPrincipal(t *testing.T) {\n\tengine := setupUserInfoEngine(&mockAccountService{}, &mockCredentialRepo{}, &tokenDomain.AccessTokenClaims{\n\t\tRegisteredClaims: jwt.RegisteredClaims{Audience: jwt.ClaimStrings{tokenDomain.GossoAPIResourceAudience}},\n\t\tClientID:         "machine-client",\n\t\tPrincipalType:    tokenDomain.PrincipalTypeClient,\n\t\tScope:            "profile",\n\t})\n\n\treq := httptest.NewRequest(http.MethodGet, "/oidc/userinfo", nil)\n\tw := httptest.NewRecorder()\n\tengine.ServeHTTP(w, req)\n\n\tassert.Equal(t, http.StatusUnauthorized, w.Code)\n\tassert.Contains(t, w.Body.String(), "invalid token audience or principal")\n}\n\n'''
          if marker not in text:
              raise SystemExit("UserInfo NoClaims marker not found")
          test.write_text(text.replace(marker, new_test + marker, 1))
          PY
          gofmt -w internal/oidc/controller/oidc_controller.go internal/oidc/controller/oidc_controller_test.go
          go test ./internal/oidc/controller
          git diff --check
      - name: Commit audience enforcement
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/oidc/controller/oidc_controller.go internal/oidc/controller/oidc_controller_test.go
          git commit -m "fix(security): enforce UserInfo resource audience"
          git push origin HEAD:security/baseline-2026-09
