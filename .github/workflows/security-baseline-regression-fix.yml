name: Security Baseline Regression Fixer

on:
  push:
    branches:
      - security/baseline-2026-09

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: security/baseline-2026-09
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - name: Update security regression fixtures and dependencies
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          # Account-security controller tests intentionally model authenticated
          # first-party users. Make that principal contract explicit instead of
          # relying on the pre-baseline "AccountID means user" assumption.
          for filename in (
              "internal/auth/controller/auth_mfa_test.go",
              "internal/auth/controller/auth_password_test.go",
          ):
              p = Path(filename)
              text = p.read_text()
              old = '''claims := &tokenDomain.AccessTokenClaims{\n\t\tAccountID: "account-001",\n\t}'''
              new = '''claims := &tokenDomain.AccessTokenClaims{\n\t\tAccountID:     "account-001",\n\t\tSessionID:     "session-001",\n\t\tPrincipalType: tokenDomain.PrincipalTypeUserSession,\n\t}'''
              count = text.count(old)
              if count == 0:
                  raise SystemExit(f"expected legacy authenticated claims fixture in {filename}")
              p.write_text(text.replace(old, new))

          admin_test = Path("internal/auth/middleware/auth_middleware_test.go")
          text = admin_test.read_text()
          old = '''ctx.Set(gm.ContextKeyClaims, &tokenDomain.AccessTokenClaims{\n\t\t\tRoles: []string{"admin", "user"},\n\t\t\tScope: "openid admin",\n\t\t})'''
          new = '''ctx.Set(gm.ContextKeyClaims, &tokenDomain.AccessTokenClaims{\n\t\t\tAccountID:     "account-admin",\n\t\t\tSessionID:     "session-admin",\n\t\t\tPrincipalType: tokenDomain.PrincipalTypeUserSession,\n\t\t\tRoles:         []string{"admin", "user"},\n\t\t\tScope:         "openid admin",\n\t\t})'''
          if old not in text:
              raise SystemExit("admin success claims fixture anchor not found")
          admin_test.write_text(text.replace(old, new, 1))

          oauth_test = Path("internal/oauth2/controller/oauth2_controller_test.go")
          text = oauth_test.read_text()
          old = '''\t\tScopes:           []string{"openid", "profile", "email"},\n\t\tIsConfidential:   true,'''
          new = '''\t\tScopes:           []string{"openid", "profile", "email"},\n\t\tAllowedResources: []string{"https://api.example.com"},\n\t\tIsConfidential:   true,'''
          if old not in text:
              raise SystemExit("confidential test client resource anchor not found")
          text = text.replace(old, new, 1)
          old = '''body := "grant_type=client_credentials&client_id=cid-test&client_secret=test-secret&scope=openid profile"'''
          new = '''body := "grant_type=client_credentials&client_id=cid-test&client_secret=test-secret&scope=openid+profile&resource=https%3A%2F%2Fapi.example.com"'''
          if old not in text:
              raise SystemExit("client_credentials success request anchor not found")
          oauth_test.write_text(text.replace(old, new, 1))
          PY

          # Trivy reports fixed runtime vulnerabilities in the compiled binary.
          # Upgrade to the first patched compatible versions; do not suppress them.
          go get golang.org/x/crypto@v0.55.0 google.golang.org/grpc@v1.83.2
          go mod tidy
          gofmt -w \
            internal/auth/controller/auth_mfa_test.go \
            internal/auth/controller/auth_password_test.go \
            internal/auth/middleware/auth_middleware_test.go \
            internal/oauth2/controller/oauth2_controller_test.go
          git diff --check

      - name: Verify targeted regressions
        shell: bash
        run: |
          go test -race ./internal/auth/controller ./internal/auth/middleware ./internal/oauth2/controller

      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum \
            internal/auth/controller/auth_mfa_test.go \
            internal/auth/controller/auth_password_test.go \
            internal/auth/middleware/auth_middleware_test.go \
            internal/oauth2/controller/oauth2_controller_test.go
          git commit -m "fix(security): close baseline test and dependency regressions"
          git push origin HEAD:security/baseline-2026-09
